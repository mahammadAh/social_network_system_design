openapi: 3.0.0

info:
  title: OnePath 
  description: Current APIs describes interaction with OnePath - social network for traveler
  version: 1.0.0

paths:
  /posts:
    post:
      summary: Create post
      description: Method creates post with photo, description and location
      tags:
        - Post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  maxLength: 36
                  description: Unique user ID (UUID)
                image_base64:
                  type: string
                  maxLength: 2000000
                  description: Image converted to base64 (max 2MB)
                image_url:
                  type: string
                  maxLength: 150
                  description: URL of the attached photo
                description:
                  type: string
                  maxLength: 2500
                  description: Post description (max 250 words)
                location:
                  type: string
                  maxLength: 50
                  description: Location of the post
                created_at:
                  type: string
                  description: Post created dateTime
              required:
                - user_id
                - location
            examples:
              request:
                value:
                  user_id: "4509743a-da23-4f01-ab9e-536cbf7f4dac"
                  image_base64: "iVBORw0KGgoAAAANSUhEUgAABDwAAAHmCAYAAACf954N..."
                  image_url: "file_server/user_id/post_id"
                  description: "Hi, i am in France !"
                  location: "Paris, France"
                  created_at: "11-03-2026 18:12"
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    maxLength: 36
                    description: ID of the created post
                required:
                  - id
              examples:
                response:
                  value:
                    id: "4509743a-da23-4f01-ab9e-536cbf7f4dac"
        "400":
          description: Bad Request
        "500":
          description: Server error


  /posts/{id}:
    get:
      summary: Get post by id
      description: Method returns post data by id
      tags:
        - Post
      parameters:
        - name: id
          in: path
          required: true
          description: Post ID (UUID)
          schema:
            type: string
            maxLength: 36
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    maxLength: 36
                    description: Post ID (UUID)
                  user_id:
                    type: string
                    maxLength: 36
                    description: Author user ID (UUID)
                  image_url:
                    type: string
                    maxLength: 150
                    description: URL of the attached photo
                  description:
                    type: string
                    maxLength: 2500
                    description: Post description
                  location:
                    type: string
                    maxLength: 50
                    description: Location of the post
                  created_at:
                    type: string
                    description: Post created dateTime
                required:
                  - id
                  - user_id
                  - created_at
              examples:
                response:
                  value:
                    id: "4509743a-da23-4f01-ab9e-536cbf7f4dac"
                    user_id: "7a1b2c3d-da23-4f01-ab9e-536cbf7f4dac"
                    image_url: "file_server/user_id/post_id"
                    description: "Hi, i am in France !"
                    location: "Paris, France"
                    created_at: "11-03-2026 18:12"
        "404":
          description: Not found
        "500":
          description: Server error

    put:
      summary: Update post by id
      description: Method updates post description and location by id
      tags:
        - Post
      parameters:
        - name: id
          in: path
          required: true
          description: Post ID (UUID)
          schema:
            type: string
            maxLength: 36
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  maxLength: 2500
                  description: Updated post description
                location:
                  type: string
                  maxLength: 50
                  description: Updated location of the post
            examples:
              request:
                value:
                  description: "Hi, i am in Italy now !"
                  location: "Rome, Italy"
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    maxLength: 36
                    description: ID of the updated post
                required:
                  - id
              examples:
                response:
                  value:
                    id: "4509743a-da23-4f01-ab9e-536cbf7f4dac"
        "400":
          description: Bad Request
        "404":
          description: Not found
        "500":
          description: Server error

    delete:
      summary: Remove post by id
      description: Method removes post by id
      tags:
        - Post
      parameters:
        - name: id
          in: path
          required: true
          description: Post ID (UUID)
          schema:
            type: string
            maxLength: 36
      responses:
        "200":
          description: Ok
        "404":
          description: Not found
        "500":
          description: Server error








  /reactions:
    post:
      summary: Put reaction
      description: Method puts reaction on post
      tags:
        - Reaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  maxLength: 36
                  description: Unique user ID (UUID)
                post_id:
                  type: string
                  maxLength: 36
                  description: Unique post ID (UUID)
                reaction:
                  type: string
                  maxLength: 2
                  description: Reaction (emoji)
              required:
                - user_id
                - post_id
                - reaction
            examples:
              request:
                value:
                  user_id: "4509743a-da23-4f01-ab9e-536cbf7f4dac"
                  post_id: "7a1b2c3d-da23-4f01-ab9e-536cbf7f4dac"
                  reaction: "👍"
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    maxLength: 36
                    description: Reaction ID (UUID)
                  created_at:
                    type: string
                    description: Reaction created dateTime
                required:
                  - id
                  - created_at
              examples:
                response:
                  value:
                    id: "9f8e7d6c-da23-4f01-ab9e-536cbf7f4dac"
                    created_at: "11-03-2026 18:15"
        "400":
          description: Bad Request
        "500":
          description: Server error
  
  /posts/{id}/reactions/{reaction_id}:
    delete:
      summary: Remove reaction from post
      description: Method removes reaction from post by reaction id
      tags:
        - Reaction
      parameters:
        - name: id
          in: path
          required: true
          description: Post ID (UUID)
          schema:
            type: string
            maxLength: 36
        - name: reaction_id
          in: path
          required: true
          description: Reaction ID (UUID)
          schema:
            type: string
            maxLength: 36
      responses:
        "200":
          description: Ok
        "404":
          description: Not found
        "500":
          description: Server error

  /reactions/{post_id}:
    get:
      summary: View reactions by post
      description: Method returns reaction count for post
      tags:
        - Reaction
      parameters:
        - name: post_id
          in: path
          required: true
          description: Post ID (UUID)
          schema:
            type: string
            maxLength: 36
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  post_id:
                    type: string
                    maxLength: 36
                    description: Post ID (UUID)
                  reaction_count:
                    type: integer
                    description: Total number of reactions (8 bytes)
                required:
                  - post_id
                  - reaction_count
              examples:
                response:
                  value:
                    post_id: "7a1b2c3d-da23-4f01-ab9e-536cbf7f4dac"
                    reaction_count: 142
        "404":
          description: Not found
        "500":
          description: Server error






  /posts/{post_id}/comments:
    post:
      summary: Create comment
      description: Method creates comment on post
      tags:
        - Comment
      parameters:
        - name: post_id
          in: path
          required: true
          description: Post ID (UUID)
          schema:
            type: string
            maxLength: 36
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  maxLength: 36
                  description: Unique user ID (UUID)
                text:
                  type: string
                  maxLength: 200
                  description: Comment text
                created_at:
                  type: string
                  description: Comment created dateTime
              required:
                - user_id
                - text
            examples:
              request:
                value:
                  user_id: "4509743a-da23-4f01-ab9e-536cbf7f4dac"
                  text: "Amazing photo!"
                  created_at: "11-03-2026 18:12"
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    maxLength: 36
                    description: ID of the created comment
                required:
                  - id
              examples:
                response:
                  value:
                    id: "7a1b2c3d-da23-4f01-ab9e-536cbf7f4dac"
        "400":
          description: Bad Request
        "404":
          description: Not found
        "500":
          description: Server error

    get:
      summary: Get comments by post id
      description: Method returns all comments of the post
      tags:
        - Comment
      parameters:
        - name: post_id
          in: path
          required: true
          description: Post ID (UUID)
          schema:
            type: string
            maxLength: 36
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 36
                      description: Comment ID (UUID)
                    user_id:
                      type: string
                      maxLength: 36
                      description: Author user ID (UUID)
                    post_id:
                      type: string
                      maxLength: 36
                      description: Post ID (UUID)
                    text:
                      type: string
                      maxLength: 200
                      description: Comment text
                    created_at:
                      type: string
                      description: Comment created dateTime
                  required:
                    - id
                    - user_id
                    - post_id
                    - text
                    - created_at
              examples:
                response:
                  value:
                    - id: "7a1b2c3d-da23-4f01-ab9e-536cbf7f4dac"
                      user_id: "4509743a-da23-4f01-ab9e-536cbf7f4dac"
                      post_id: "9f8e7d6c-da23-4f01-ab9e-536cbf7f4dac"
                      text: "Amazing photo!"
                      created_at: "11-03-2026 18:12"
                    - id: "1c2d3e4f-da23-4f01-ab9e-536cbf7f4dac"
                      user_id: "5b6c7d8e-da23-4f01-ab9e-536cbf7f4dac"
                      post_id: "9f8e7d6c-da23-4f01-ab9e-536cbf7f4dac"
                      text: "Great place!"
                      created_at: "11-03-2026 19:45"
        "404":
          description: Not found
        "500":
          description: Server error


  /posts/{post_id}/comments/{id}:
    get:
      summary: Get comment by id
      description: Method returns comment data by id
      tags:
        - Comment
      parameters:
        - name: post_id
          in: path
          required: true
          description: Post ID (UUID)
          schema:
            type: string
            maxLength: 36
        - name: id
          in: path
          required: true
          description: Comment ID (UUID)
          schema:
            type: string
            maxLength: 36
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    maxLength: 36
                    description: Comment ID (UUID)
                  user_id:
                    type: string
                    maxLength: 36
                    description: Author user ID (UUID)
                  post_id:
                    type: string
                    maxLength: 36
                    description: Post ID (UUID)
                  text:
                    type: string
                    maxLength: 200
                    description: Comment text
                  created_at:
                    type: string
                    description: Comment created dateTime
                required:
                  - id
                  - user_id
                  - post_id
                  - text
                  - created_at
              examples:
                response:
                  value:
                    id: "7a1b2c3d-da23-4f01-ab9e-536cbf7f4dac"
                    user_id: "4509743a-da23-4f01-ab9e-536cbf7f4dac"
                    post_id: "9f8e7d6c-da23-4f01-ab9e-536cbf7f4dac"
                    text: "Amazing photo!"
                    created_at: "11-03-2026 18:12"
        "404":
          description: Not found
        "500":
          description: Server error

    put:
      summary: Update comment by id
      description: Method updates comment text by id
      tags:
        - Comment
      parameters:
        - name: post_id
          in: path
          required: true
          description: Post ID (UUID)
          schema:
            type: string
            maxLength: 36
        - name: id
          in: path
          required: true
          description: Comment ID (UUID)
          schema:
            type: string
            maxLength: 36
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  maxLength: 200
                  description: Updated comment text
              required:
                - text
            examples:
              request:
                value:
                  text: "Updated comment text!"
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    maxLength: 36
                    description: ID of the updated comment
                required:
                  - id
              examples:
                response:
                  value:
                    id: "7a1b2c3d-da23-4f01-ab9e-536cbf7f4dac"
        "400":
          description: Bad Request
        "404":
          description: Not found
        "500":
          description: Server error

    delete:
      summary: Remove comment by id
      description: Method removes comment by id
      tags:
        - Comment
      parameters:
        - name: post_id
          in: path
          required: true
          description: Post ID (UUID)
          schema:
            type: string
            maxLength: 36
        - name: id
          in: path
          required: true
          description: Comment ID (UUID)
          schema:
            type: string
            maxLength: 36
      responses:
        "200":
          description: Ok
        "404":
          description: Not found
        "500":
          description: Server error